name: Refresh data

on:
  schedule:
    # Daily at 19:17 UTC (about 06:17 in Sydney), after the upstream daily updates.
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Acquire, transform and validate every dataset
        id: publish
        continue-on-error: true   # publish what validated; fail the run afterwards
        run: python pipeline/publish.py --live
      - name: Commit refreshed data if anything changed
        run: |
          if git diff --quiet -- public/data ':!public/data/meta.json'; then
            echo "No data changes; nothing to publish."
            exit 0
          fi
          git config user.name "dv3-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: scheduled refresh $(date -u +%Y-%m-%d)"
          git push
      - name: Fail the run if any dashboard did not validate
        if: steps.publish.outcome == 'failure'
        run: |
          echo "At least one dashboard failed validation; its previous data were kept. See the publish step log."
          exit 1
